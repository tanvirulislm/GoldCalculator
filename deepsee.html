<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>সোনার ক্যালকুলেটর | Gold Calculator</title>
    <meta name="description" content="ভরি, আনা, রতি, গ্রাম হিসাবে সোনার দাম, পুরাতন সোনা বিনিময় ও মজুরির হিসাব।" />
    <meta name="theme-color" content="#0b0d12" />
    <style>
      :root {
        --bg: #0b0d12;
        --surface: #12151c;
        --surface-2: #171b24;
        --line: #232833;
        --line-strong: #2e3442;
        --tx: #ede8dc;
        --tx-dim: #b8b2a4;
        --mut: #7c776a;
        --gold: #d4a537;
        --gold-soft: rgba(212, 165, 55, 0.12);
        --gold-line: rgba(212, 165, 55, 0.35);
        --red: #f2a0a8;
        --grn: #7dd8b0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family:
          'Noto Sans Bengali',
          'Hind Siliguri',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }

      /* ---------- Header ---------- */
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      #logo {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: contain;
        flex: none;
        background: var(--surface-2);
        border: 1px solid var(--line);
      }
      .ttl {
        flex: 1;
        min-width: 0;
      }
      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--tx);
        letter-spacing: -0.01em;
      }
      .ttl p {
        margin: 2px 0 0;
        font-size: 0.75rem;
        color: var(--mut);
      }

      /* ---------- Segmented control (shared) ---------- */
      .seg {
        display: inline-flex;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 3px;
        gap: 2px;
      }
      .seg button {
        border: 0;
        background: none;
        color: var(--tx-dim);
        padding: 6px 12px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.78rem;
        font-family: inherit;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .seg button:hover {
        color: var(--tx);
      }
      .seg button.on {
        background: var(--gold);
        color: #1a1204;
      }

      /* ---------- Cards ---------- */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        margin-top: 12px;
      }
      .card h2 {
        margin: 0 0 14px;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--tx-dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .n {
        background: var(--surface-2);
        color: var(--gold);
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        font-weight: 700;
        flex: none;
        border: 1px solid var(--line-strong);
      }

      /* ---------- Form ---------- */
      label {
        display: block;
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--mut);
        margin-bottom: 6px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      input,
      select {
        width: 100%;
        height: 44px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: 9px;
        background: var(--bg);
        color: var(--tx);
        font-size: 0.95rem;
        font-weight: 600;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      input::placeholder {
        color: var(--mut);
        font-weight: 500;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 0 3px var(--gold-soft);
      }
      select {
        cursor: pointer;
      }
      select option {
        background: var(--surface);
        color: var(--tx);
      }

      .row {
        display: grid;
        gap: 10px;
      }
      .c3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .c4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .mt {
        margin-top: 14px;
      }

      /* ---------- Result lines ---------- */
      .line {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.85rem;
        padding: 7px 0;
        color: var(--tx-dim);
      }
      .line b {
        color: var(--tx);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .line.neg,
      .line.neg b {
        color: var(--red);
      }

      .hint {
        font-size: 0.72rem;
        color: var(--mut);
        margin: 10px 0 0;
        line-height: 1.5;
      }

      .tot {
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        font-weight: 600;
        font-size: 0.88rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        color: var(--tx-dim);
      }
      .tot span:last-child {
        color: var(--tx);
        font-size: 1rem;
        font-variant-numeric: tabular-nums;
      }

      /* ---------- Mode selector ---------- */
      .modes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 4px;
      }
      .modes button {
        border: 0;
        background: none;
        color: var(--tx-dim);
        border-radius: 8px;
        padding: 10px 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.75rem;
        font-family: inherit;
        line-height: 1.3;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .modes button:hover {
        color: var(--tx);
      }
      .modes button.on {
        background: var(--gold);
        color: #1a1204;
      }

      /* ---------- Final result ---------- */
      .final {
        background: var(--surface);
        border: 1px solid var(--gold-line);
        border-radius: 14px;
        padding: 18px;
        margin-top: 12px;
      }
      .final h2 {
        margin: 0 0 12px;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .final .tot {
        background: var(--gold-soft);
        border: 1px solid var(--gold-line);
        margin-top: 12px;
        padding: 16px;
      }
      .final .tot span:first-child {
        color: var(--gold);
        font-size: 0.82rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 600;
      }
      .final .tot span:last-child {
        color: var(--gold);
        font-size: 1.5rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .big {
        font-size: 1.75rem !important;
        font-weight: 700 !important;
      }
      .recv {
        color: var(--grn) !important;
      }

      /* ---------- Buttons ---------- */
      .btns {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 8px;
        margin-top: 14px;
      }
      .btns button {
        height: 44px;
        padding: 0 12px;
        border-radius: 9px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        color: var(--tx);
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.82rem;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .btns button:hover {
        border-color: var(--gold-line);
      }
      .btns .pri {
        background: var(--gold);
        color: #1a1204;
        border: 1px solid var(--gold);
      }
      .btns .pri:hover {
        background: #e0b248;
      }

      /* ---------- Footer ---------- */
      .fm {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        font-size: 0.75rem;
        color: var(--mut);
      }
      .disc {
        font-size: 0.72rem;
        color: var(--mut);
        text-align: center;
        margin: 16px 0 4px;
        line-height: 1.5;
      }
      .hide {
        display: none !important;
      }

      @media (max-width: 460px) {
        .wrap {
          padding: 14px 12px 40px;
        }
        .c3 {
          grid-template-columns: 1fr 1fr;
        }
        .c4 {
          grid-template-columns: 1fr 1fr;
        }
        .btns {
          grid-template-columns: 1fr 1fr;
        }
        .btns .pri {
          grid-column: 1 / -1;
        }
        h1 {
          font-size: 1.05rem;
        }
        .final .tot span:last-child {
          font-size: 1.35rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <img id="logo" alt="Gold Calculator" src="GoldCalculator.png" />
        <div class="ttl">
          <h1 data-i="title"></h1>
          <p data-i="sub"></p>
        </div>
        <div class="seg" id="langSeg"><button data-l="bn">বাং</button><button data-l="en">EN</button></div>
      </header>

      <section class="card" id="cfg">
        <h2><span class="n">1</span><span data-i="rateT"></span></h2>
        <div class="row c3">
          <div>
            <label for="karat" data-i="karat"></label>
            <select id="karat">
              <option value="22">22K</option>
              <option value="21">21K</option>
              <option value="18">18K</option>
              <option value="san" data-i="san"></option>
            </select>
          </div>
          <div><label for="rate" data-i="price"></label><input id="rate" type="number" inputmode="decimal" min="0" step="any" placeholder="0" /></div>
          <div>
            <label data-i="unit"></label>
            <div class="seg" id="unitSeg" style="display: flex"><button data-u="bhori" style="flex: 1" data-i="bhori"></button><button data-u="gram" style="flex: 1" data-i="gram"></button></div>
          </div>
        </div>
        <p class="hint" data-i="rateHint"></p>
      </section>

      <section class="card">
        <h2><span class="n">2</span><span data-i="typeT"></span></h2>
        <div class="modes">
          <button data-m="new" data-i="mNew"></button>
          <button data-m="old" data-i="mOld"></button>
          <button data-m="both" data-i="mBoth"></button>
        </div>
      </section>

      <section class="card" id="panelNew">
        <h2><span class="n">3</span><span data-i="newT"></span></h2>
        <div class="row c4" data-w="new">
          <div><label data-i="ana"></label><input type="number" inputmode="decimal" min="0" step="any" data-f="ana" /></div>
          <div><label data-i="roti"></label><input type="number" inputmode="decimal" min="0" step="any" data-f="roti" /></div>
          <div><label data-i="point"></label><input type="number" inputmode="decimal" min="0" step="any" data-f="point" /></div>
          <div><label data-i="gramL"></label><input type="number" inputmode="decimal" min="0" step="any" data-f="gram" /></div>
        </div>
        <p class="hint" data-i="conv"></p>
        <div class="line mt"><span data-i="goldVal"></span><b id="nVal"></b></div>
        <div class="row c3 mt">
          <div><label data-i="mk"></label><input id="mk" type="number" inputmode="decimal" min="0" step="any" value="0" /></div>
          <div>
            <label data-i="mkType"></label
            ><select id="mkType">
              <option value="pct">%</option>
              <option value="fix">৳</option>
            </select>
          </div>
          <div><label data-i="vat"></label><input id="vat" type="number" inputmode="decimal" min="0" step="any" value="0" /></div>
        </div>
        <div class="mt"><label data-i="other"></label><input id="other" type="number" inputmode="decimal" min="0" step="any" value="0" /></div>
        <div class="line mt"><span data-i="mkAmt"></span><b id="nMk"></b></div>
        <div class="line"><span data-i="vatAmt"></span><b id="nVat"></b></div>
        <div class="tot"><span data-i="newTotal"></span><span id="nTot"></span></div>
      </section>

      <section class="card" id="panelOld">
        <h2><span class="n" id="oldNum">4</span><span data-i="oldT"></span></h2>
        <div class="row c4" data-w="old">
          <div><label data-i="ana"></label><input type="number" inputmode="decimal" min="0" step="any" data-f="ana" /></div>
          <div><label data-i="roti"></label><input type="number" inputmode="decimal" min="0" step="any" data-f="roti" /></div>
          <div><label data-i="point"></label><input type="number" inputmode="decimal" min="0" step="any" data-f="point" /></div>
          <div><label data-i="gramL"></label><input type="number" inputmode="decimal" min="0" step="any" data-f="gram" /></div>
        </div>
        <div class="mt"><label data-i="ded"></label><input id="ded" type="number" inputmode="decimal" min="0" max="100" step="any" value="12" /></div>
        <div class="line mt"><span data-i="before"></span><b id="oVal"></b></div>
        <div class="line neg"><span data-i="dedAmt"></span><b id="oDed"></b></div>
        <div class="tot"><span data-i="exch"></span><span id="oTot"></span></div>
      </section>

      <section class="card final">
        <h2 data-i="finalT"></h2>
        <div class="line" id="fNewRow"><span data-i="newTotal"></span><b id="fNew"></b></div>
        <div class="line neg" id="fOldRow"><span data-i="minusOld"></span><b id="fOld"></b></div>
        <div class="tot mt"><span id="fLabel"></span><span class="big" id="fAmt"></span></div>
      </section>

      <div class="btns">
        <button class="pri" id="dlBtn" data-i="dl"></button>
        <button id="shareBtn" data-i="share"></button>
        <button id="resetBtn" data-i="reset"></button>
      </div>
      <div class="fm">
        <span data-i="size"></span>
        <div class="seg" id="fmtSeg"><button data-s="sq">1:1</button><button data-s="pt">4:5</button></div>
      </div>
      <p class="disc" data-i="disc"></p>
      <p class="disc" id="toast" style="color: var(--grn); min-height: 1em"></p>
    </div>

    <script>
      const LOGO = 'GoldCalculator.png' // ← your logo file (same folder as index.html)
      const BHORI_G = 11.664,
        PTS = 960
      const FF = '"Noto Sans Bengali","Hind Siliguri",system-ui,"Segoe UI",sans-serif'
      const T = {
        bn: {
          title: 'সোনার ক্যালকুলেটর',
          sub: 'সোনার দাম, ওজন ও বিনিময় হিসাব',
          rateT: 'আজকের সোনার দাম',
          karat: 'ক্যারেট',
          san: 'সনাতন',
          price: 'দাম (৳)',
          unit: 'একক',
          bhori: 'প্রতি ভরি',
          gram: 'প্রতি গ্রাম',
          rateHint: 'প্রতিটি ক্যারেটের দাম আলাদা সংরক্ষিত থাকে।',
          typeT: 'হিসাবের ধরন',
          mNew: 'নতুন সোনা ক্রয়',
          mOld: 'পুরাতন সোনা বিক্রি',
          mBoth: 'পুরাতন দিয়ে নতুন ক্রয়',
          newT: 'নতুন সোনা',
          oldT: 'পুরাতন সোনা',
          ana: 'আনা',
          roti: 'রতি',
          point: 'পয়েন্ট',
          gramL: 'গ্রাম',
          conv: '১ ভরি = ১৬ আনা = ৯৬ রতি = ৯৬০ পয়েন্ট = ১১.৬৬৪ গ্রাম',
          goldVal: 'সোনার দাম',
          mk: 'মজুরি',
          mkType: 'ধরন',
          vat: 'ভ্যাট %',
          other: 'অন্যান্য খরচ (৳)',
          mkAmt: 'মজুরি',
          vatAmt: 'ভ্যাট',
          newTotal: 'নতুন সোনার মোট দাম',
          ded: 'কর্তন % (ভ্যাটসহ)',
          before: 'কর্তনের আগে দাম',
          dedAmt: 'কর্তন',
          exch: 'বিনিময় মূল্য',
          finalT: 'চূড়ান্ত হিসাব',
          minusOld: 'বাদ: পুরাতন সোনার মূল্য',
          pay: 'আপনাকে দিতে হবে',
          recv: 'আপনি পাবেন',
          dl: '⬇ ছবি ডাউনলোড',
          share: 'শেয়ার',
          reset: 'রিসেট',
          size: 'ছবির সাইজ',
          copied: 'কপি হয়েছে ✓',
          disc: 'এটি আনুমানিক হিসাব। চূড়ান্ত দাম জুয়েলারির রেট ও চার্জের উপর নির্ভর করে।',
          bh: 'ভরি',
          gr: 'গ্রাম',
        },
        en: {
          title: 'Gold Calculator',
          sub: 'Gold price, weight & exchange',
          rateT: "Today's Gold Price",
          karat: 'Karat',
          san: 'Traditional',
          price: 'Price (৳)',
          unit: 'Unit',
          bhori: 'Per Bhori',
          gram: 'Per Gram',
          rateHint: 'Each karat keeps its own saved rate.',
          typeT: 'Calculation Type',
          mNew: 'New Gold Purchase',
          mOld: 'Sell Old Gold',
          mBoth: 'Exchange + New Purchase',
          newT: 'New Gold',
          oldT: 'Old Gold',
          ana: 'Ana',
          roti: 'Roti',
          point: 'Point',
          gramL: 'Gram',
          conv: '1 Bhori = 16 Ana = 96 Roti = 960 Point = 11.664 g',
          goldVal: 'Gold Value',
          mk: 'Making Charge',
          mkType: 'Type',
          vat: 'VAT %',
          other: 'Other Charge (৳)',
          mkAmt: 'Making Charge',
          vatAmt: 'VAT',
          newTotal: 'Total New Gold Price',
          ded: 'Deduction % (incl. VAT)',
          before: 'Value before deduction',
          dedAmt: 'Deduction',
          exch: 'Exchange Value',
          finalT: 'Final Calculation',
          minusOld: 'Minus: Old Gold Value',
          pay: 'Amount to Pay',
          recv: 'You Will Receive',
          dl: '⬇ Download Image',
          share: 'Share',
          reset: 'Reset',
          size: 'Image size',
          copied: 'Copied ✓',
          disc: "Estimates only. Final price depends on your jeweller's rate and charges.",
          bh: 'Bhori',
          gr: 'g',
        },
      }
      const $ = id => document.getElementById(id)
      const S = { lang: 'bn', unit: 'bhori', mode: 'new', karat: '22', rates: {}, ded: 12, mk: 0, mkType: 'pct', vat: 0, other: 0, fmt: 'sq' }
      let card = { rows: [], final: '', amt: '', recv: false, rate: '', text: '' }

      const load = () => {
        try {
          Object.assign(S, JSON.parse(localStorage.getItem('goldCalcV3') || '{}'))
        } catch (e) {}
      }
      const save = () => {
        try {
          localStorage.setItem('goldCalcV3', JSON.stringify(S))
        } catch (e) {}
      }
      const num = v => Math.max(0, parseFloat(v) || 0)
      const fmt = v => '৳' + (+v || 0).toLocaleString('en-BD', { minimumFractionDigits: 2, maximumFractionDigits: 2 })
      const t = k => T[S.lang][k]
      const wtTxt = bh => `${bh.toFixed(4)} ${t('bh')} (${(bh * BHORI_G).toFixed(3)} ${t('gr')})`

      // logo (with graceful fallback)
      const logo = $('logo')
      const MARK =
        'data:image/svg+xml;utf8,' +
        encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde7a1"/><stop offset=".5" stop-color="#e9b949"/><stop offset="1" stop-color="#a8701a"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><path d="M12 40l7-18h26l7 18-6 8H18z" fill="#fff6d6" stroke="#6b430b" stroke-width="2" stroke-linejoin="round"/></svg>',
        )
      logo.onerror = () => {
        logo.onerror = null
        logo.src = MARK
      }

      function applyLang() {
        document.documentElement.lang = S.lang
        document.querySelectorAll('[data-i]').forEach(e => (e.textContent = t(e.dataset.i)))
        const on = (sel, attr, val) => document.querySelectorAll(sel).forEach(b => b.classList.toggle('on', b.dataset[attr] === val))
        on('#langSeg button', 'l', S.lang)
        on('#unitSeg button', 'u', S.unit)
        on('.modes button', 'm', S.mode)
        on('#fmtSeg button', 's', S.fmt)
      }

      function bhoriOf(box) {
        const g = f => num(box.querySelector(`[data-f=${f}]`).value)
        return (g('ana') * 60 + g('roti') * 10 + g('point')) / PTS
      }
      function setFromBhori(box, bh, skip) {
        const p = bh * PTS,
          ana = Math.floor(p / 60 + 1e-9),
          roti = Math.floor((p - ana * 60) / 10 + 1e-9),
          pt = Math.round((p - ana * 60 - roti * 10) * 100) / 100
        const set = (f, v) => {
          if (f !== skip) box.querySelector(`[data-f=${f}]`).value = v || ''
        }
        set('ana', ana)
        set('roti', roti)
        set('point', pt)
      }
      function wireWeight(box) {
        box.addEventListener('input', e => {
          const f = e.target.dataset.f
          if (!f) return
          if (f === 'gram') setFromBhori(box, num(e.target.value) / BHORI_G, 'gram')
          else box.querySelector('[data-f=gram]').value = (bhoriOf(box) * BHORI_G).toFixed(3).replace(/\.?0+$/, '') || ''
          calc()
        })
        box.addEventListener('change', () => {
          const bh = bhoriOf(box)
          if (bh > 0) setFromBhori(box, bh)
          calc()
        })
      }

      function calc() {
        S.rates[S.karat] = $('rate').value
        S.ded = $('ded').value
        S.mk = $('mk').value
        S.mkType = $('mkType').value
        S.vat = $('vat').value
        S.other = $('other').value
        const rate = num($('rate').value),
          perBhori = S.unit === 'bhori' ? rate : rate * BHORI_G
        const nBh = bhoriOf(document.querySelector('[data-w=new]')),
          oBh = bhoriOf(document.querySelector('[data-w=old]'))
        const nVal = nBh * perBhori,
          mkIn = num($('mk').value),
          mk = S.mkType === 'pct' ? (nVal * mkIn) / 100 : mkIn
        const vat = ((nVal + mk) * num($('vat').value)) / 100,
          other = num($('other').value),
          nTot = nVal + mk + vat + other
        const oVal = oBh * perBhori,
          dp = Math.min(100, num($('ded').value)),
          oDed = (oVal * dp) / 100,
          oTot = oVal - oDed

        $('nVal').textContent = fmt(nVal)
        $('nMk').textContent = fmt(mk)
        $('nVat').textContent = fmt(vat)
        $('nTot').textContent = fmt(nTot)
        $('oVal').textContent = fmt(oVal)
        $('oDed').textContent = '-' + fmt(oDed)
        $('oTot').textContent = fmt(oTot)

        const useNew = S.mode !== 'old',
          useOld = S.mode !== 'new',
          newP = useNew ? nTot : 0,
          oldP = useOld ? oTot : 0,
          diff = newP - oldP,
          recv = diff < 0
        $('fNew').textContent = fmt(newP)
        $('fOld').textContent = '-' + fmt(oldP)
        $('fNewRow').classList.toggle('hide', !useNew)
        $('fOldRow').classList.toggle('hide', !useOld)
        $('fLabel').textContent = recv ? t('recv') : t('pay')
        $('fAmt').textContent = fmt(Math.abs(diff))
        $('fAmt').className = 'big' + (recv ? ' recv' : '')

        const rows = []
        if (useNew) {
          rows.push(['h', `${t('newT')} · ${wtTxt(nBh)}`], ['r', t('goldVal'), fmt(nVal)])
          if (mk > 0) rows.push(['r', t('mkAmt') + (S.mkType === 'pct' ? ` (${mkIn}%)` : ''), fmt(mk)])
          if (vat > 0) rows.push(['r', `${t('vatAmt')} (${num($('vat').value)}%)`, fmt(vat)])
          if (other > 0) rows.push(['r', t('other').replace(' (৳)', ''), fmt(other)])
          rows.push(['b', t('newTotal'), fmt(nTot)])
        }
        if (useOld) {
          rows.push(['h', `${t('oldT')} · ${wtTxt(oBh)}`], ['r', t('before'), fmt(oVal)], ['n', `${t('dedAmt')} (${dp}%)`, '-' + fmt(oDed)], ['b', t('exch'), fmt(oTot)])
        }
        const kl = S.karat === 'san' ? t('san') : S.karat + 'K'
        card = { rows, label: recv ? t('recv') : t('pay'), amt: fmt(Math.abs(diff)), recv, rate: `${kl}  •  ${fmt(rate)} / ${S.unit === 'bhori' ? t('bhori').replace('প্রতি ', '').replace('Per ', '') : t('gram').replace('প্রতি ', '').replace('Per ', '')}` }
        card.text = [`${t('title')} (${kl})`, ...rows.map(r => (r[0] === 'h' ? '— ' + r[1] : `${r[1]}: ${r[2]}`)), `${card.label}: ${card.amt}`, '', t('disc')].join('\n')
        save()
      }

      function setMode(m) {
        S.mode = m
        $('panelNew').classList.toggle('hide', m === 'old')
        $('panelOld').classList.toggle('hide', m === 'new')
        $('oldNum').textContent = m === 'old' ? '3' : '4'
        applyLang()
        calc()
      }

      /* ========= SOCIAL IMAGE ========= */
      function rr(c, x, y, w, h, r) {
        c.beginPath()
        c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h)
      }
      function fit(c, txt, maxW, size, weight) {
        let s = size
        do {
          c.font = `${weight} ${s}px ${FF}`
          s--
        } while (c.measureText(txt).width > maxW && s > 12)
        return s
      }
      function drawCard(withLogo) {
        const W = 1080,
          H = S.fmt === 'pt' ? 1350 : 1080,
          P = 64,
          cv = document.createElement('canvas')
        cv.width = W
        cv.height = H
        const c = cv.getContext('2d'),
          gold = (x0, y0, x1, y1) => {
            const g = c.createLinearGradient(x0, y0, x1, y1)
            g.addColorStop(0, '#fde7a1')
            g.addColorStop(0.5, '#e9b949')
            g.addColorStop(1, '#a8701a')
            return g
          }
        // background
        let g = c.createLinearGradient(0, 0, W, H)
        g.addColorStop(0, '#0a0c11')
        g.addColorStop(1, '#1c1507')
        c.fillStyle = g
        c.fillRect(0, 0, W, H)
        g = c.createRadialGradient(W - 80, 40, 10, W - 80, 40, 620)
        g.addColorStop(0, 'rgba(233,185,73,.28)')
        g.addColorStop(1, 'rgba(233,185,73,0)')
        c.fillStyle = g
        c.fillRect(0, 0, W, H)
        g = c.createRadialGradient(0, H, 10, 0, H, 520)
        g.addColorStop(0, 'rgba(233,185,73,.14)')
        g.addColorStop(1, 'rgba(233,185,73,0)')
        c.fillStyle = g
        c.fillRect(0, 0, W, H)
        c.strokeStyle = gold(0, 0, W, H)
        c.lineWidth = 3
        rr(c, 24, 24, W - 48, H - 48, 36)
        c.stroke()
        // header
        const ls = 104
        if (withLogo && logo.complete && logo.naturalWidth) c.drawImage(logo, P, P - 4, ls, ls)
        else {
          c.fillStyle = gold(P, P, P + ls, P + ls)
          rr(c, P, P - 4, ls, ls, 26)
          c.fill()
          c.fillStyle = '#fff6d6'
          c.font = `800 46px ${FF}`
          c.textAlign = 'center'
          c.fillText('Au', P + ls / 2, P + ls / 2 + 18)
          c.textAlign = 'left'
        }
        c.fillStyle = gold(P + ls + 24, 0, W - P, 0)
        c.font = `800 54px ${FF}`
        c.textBaseline = 'alphabetic'
        c.fillText(t('title'), P + ls + 24, P + 44)
        c.fillStyle = '#9a9484'
        c.font = `500 26px ${FF}`
        c.fillText(new Date().toLocaleDateString(S.lang === 'bn' ? 'bn-BD' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }), P + ls + 24, P + 86)
        // rate pill
        const py = P + ls + 34
        c.font = `700 30px ${FF}`
        const pw = c.measureText(card.rate).width + 56
        c.fillStyle = 'rgba(233,185,73,.12)'
        rr(c, P, py, pw, 60, 30)
        c.fill()
        c.strokeStyle = 'rgba(233,185,73,.4)'
        c.lineWidth = 2
        c.stroke()
        c.fillStyle = '#fde7a1'
        c.fillText(card.rate, P + 28, py + 41)
        // rows
        const top = py + 90,
          fh = H === 1350 ? 230 : 200,
          bottom = H - fh - 100,
          n = card.rows.length || 1,
          rh = Math.min(66, (bottom - top) / n),
          fs = Math.max(20, Math.min(32, rh * 0.52))
        card.rows.forEach((r, i) => {
          const y = top + i * rh,
            cy = y + rh / 2 + fs * 0.35
          if (r[0] === 'h') {
            c.fillStyle = '#e9b949'
            const s = fit(c, r[1], W - 2 * P, fs, '700')
            c.fillText(r[1], P, cy)
            c.fillStyle = 'rgba(233,185,73,.35)'
            c.fillRect(P, y + rh - 4, W - 2 * P, 2)
            return
          }
          const bold = r[0] === 'b'
          c.fillStyle = r[0] === 'n' ? '#fda4af' : bold ? '#fde7a1' : '#e8e2d2'
          c.font = `${bold ? 800 : 500} ${fs}px ${FF}`
          c.textAlign = 'left'
          c.fillText(r[1], P, cy)
          c.textAlign = 'right'
          c.font = `700 ${fs}px ${FF}`
          c.fillText(r[2], W - P, cy)
          c.textAlign = 'left'
        })
        // final box
        const fy = H - fh - 100
        c.fillStyle = gold(P, fy, W - P, fy + fh)
        rr(c, P, fy, W - 2 * P, fh, 32)
        c.fill()
        c.fillStyle = '#2a1a05'
        c.font = `700 32px ${FF}`
        c.fillText(card.label, P + 40, fy + 60)
        const as = fit(c, card.amt, W - 2 * P - 80, H === 1350 ? 110 : 96, '800')
        c.font = `800 ${as}px ${FF}`
        c.fillText(card.amt, P + 40, fy + fh - 44)
        // footer
        c.textAlign = 'center'
        c.fillStyle = '#8d8777'
        const ds = fit(c, t('disc'), W - 2 * P, 22, '500')
        c.font = `500 ${ds}px ${FF}`
        c.fillText(t('disc'), W / 2, H - 62)
        c.textAlign = 'left'
        return cv
      }
      function makeBlob() {
        return new Promise(res => {
          let cv = drawCard(true)
          try {
            cv.toBlob(b => res(b), 'image/png')
          } catch (e) {
            cv = drawCard(false)
            cv.toBlob(b => res(b), 'image/png')
          }
        })
      }
      function toast(m) {
        $('toast').textContent = m
        setTimeout(() => ($('toast').textContent = ''), 2200)
      }

      function init() {
        load()
        $('karat').value = S.karat
        $('rate').value = S.rates[S.karat] || ''
        $('ded').value = S.ded
        $('mk').value = S.mk
        $('mkType').value = S.mkType
        $('vat').value = S.vat
        $('other').value = S.other
        document.querySelectorAll('[data-w]').forEach(wireWeight)
        ;['rate', 'ded', 'mk', 'mkType', 'vat', 'other'].forEach(id => $(id).addEventListener('input', calc))
        $('karat').addEventListener('change', e => {
          S.rates[S.karat] = $('rate').value
          S.karat = e.target.value
          $('rate').value = S.rates[S.karat] || ''
          calc()
        })
        document.querySelectorAll('#langSeg button').forEach(
          b =>
            (b.onclick = () => {
              S.lang = b.dataset.l
              applyLang()
              calc()
            }),
        )
        document.querySelectorAll('#unitSeg button').forEach(
          b =>
            (b.onclick = () => {
              S.unit = b.dataset.u
              applyLang()
              calc()
            }),
        )
        document.querySelectorAll('#fmtSeg button').forEach(
          b =>
            (b.onclick = () => {
              S.fmt = b.dataset.s
              applyLang()
              save()
            }),
        )
        document.querySelectorAll('.modes button').forEach(b => (b.onclick = () => setMode(b.dataset.m)))
        $('resetBtn').onclick = () => {
          document.querySelectorAll('[data-w] input').forEach(i => (i.value = ''))
          $('mk').value = 0
          $('vat').value = 0
          $('other').value = 0
          $('ded').value = 12
          calc()
        }
        $('dlBtn').onclick = async () => {
          const b = await makeBlob(),
            a = document.createElement('a')
          a.href = URL.createObjectURL(b)
          a.download = 'gold-calculation.png'
          a.click()
          setTimeout(() => URL.revokeObjectURL(a.href), 4000)
        }
        $('shareBtn').onclick = async () => {
          try {
            const b = await makeBlob(),
              f = new File([b], 'gold-calculation.png', { type: 'image/png' })
            if (navigator.canShare && navigator.canShare({ files: [f] })) {
              await navigator.share({ files: [f] })
              return
            }
          } catch (e) {
            if (e.name === 'AbortError') return
          }
          try {
            await navigator.clipboard.writeText(card.text)
            toast(t('copied'))
          } catch (e) {
            prompt('Copy:', card.text)
          }
        }
        setMode(S.mode)
      }
      ;(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(init)
    </script>
  </body>
</html>
